# Active when spring.profiles.active=local (the default -- see application.yml).
# Values fall back to sensible local defaults if the env vars aren't set,
# so a teammate can `docker compose up -d` and run the app with zero extra config.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:campusmentor}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:campusmentor_user}
    password: ${DB_PASSWORD:campusmentor_pass}
  jpa:
    hibernate:
      ddl-auto: update   # OK for solo local dev; Week 1 only -- we'll move to migrations later
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.campusmentor: DEBUG
